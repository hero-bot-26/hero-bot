name: Hero master app daily update

# 매일 PLM·실적 구글시트(데이터브릭스 자동출력)를 읽어 app.html 재생성 → hero-master-app에 push → Vercel 재배포.
# 랩탑 무관(클라우드 실행).
#   ★2026-07-29 재설계: 실적 DBX 잡을 07:00 → **09:30**으로 옮겼다(원천 사전집계가 09:07쯤 적재돼
#   07:00 실행은 당일분을 덜 읽었다). 잡이 ~3h 걸리므로 09시대에 시트를 읽으면 탭마다 기준일이 섞인다
#   (실제 사고: MTD는 7/28인데 FWTD는 7/27 → 26FW 누계가 하루 통째로 밀림).
#   → CI는 종전대로 랭킹봇 완료 직후 시작하되, `wait_sheet_fresh.py`로 **시트가 전일 기준으로
#     다 채워질 때까지 대기**(최대 4h)한 뒤 생성한다. 대기 타임아웃이어도 생성기 신선도 게이트가
#     실적·PMKT 주입만 건너뛰므로 섞인 값은 앱에 실리지 않는다.
on:
  # ★정시성: GitHub 네이티브 schedule 은 백로그로 3~6h 밀려 신뢰 불가.
  #   랭킹봇 daily("Daily ranking report")는 cron-job.org 가 09:00 KST 정시 dispatch 하므로,
  #   그 완료 직후 체이닝(workflow_run)으로 시작 → 시트 대기 → 생성(보통 12:30 전후 완료).
  workflow_run:
    workflows: ["Daily ranking report"]
    types: [completed]
  schedule:
    - cron: "0 5 * * *"    # fallback (14:00 KST 의도, 지연 가능) — 체이닝 놓친 날 보정
  workflow_dispatch: {}     # 수동 실행 버튼

concurrency:
  group: hero-app-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 시트 대기(최대 4h) 포함. public 레포라 Actions 분 무과금.
    steps:
      - name: Checkout hero_bot (생성기)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pandas openpyxl        # plm_ingest import용 (requirements 미포함)

      # ★히어로 uid 목록을 실적 시트 `_히어로UID` 탭에 먼저 밀어넣는다(09시대) —
      #   DBX 잡(09:30)이 이 탭을 읽어 GOODS_FILTER를 만든다. 새 컬러/스타일 uid가 그날 바로 잡힌다.
      - name: 히어로 uid 목록 갱신 (노트북 필터 소스)
        continue-on-error: true
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: python push_hero_uids.py

      # ★실적 시트(DBX 잡 09:30~약 3h)가 전일 기준으로 다 채워질 때까지 대기 — 반쯤 쓰인 시트를 읽지 않기 위함.
      - name: Wait for sales sheet (전일 기준 완성 대기)
        continue-on-error: true          # 대기 실패해도 생성은 진행(게이트가 실적·PMKT를 보류)
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: python wait_sheet_fresh.py --timeout-min 240 --interval-min 5

      # ★★2026-08-07 이 스텝을 '대기 뒤'로 옮겼다 — 원래는 잡 맨 앞(09:03)에 체크아웃하고
      #   시트를 최대 4h 기다린 뒤(13:0x) push 했다. 그 4시간 사이에 main 이 움직이면
      #   (그날 PR 머지 등) push 가 무조건 rejected 되고 **그날 데이터 갱신이 통째로 버려진다.**
      #   실제 사고 2026-08-06: 생성은 성공했는데 `! [rejected] main -> main (fetch first)` 로
      #   커밋 폐기 → 자동 갱신이 8/5 에서 멈춤(오후 수동 재생성으로 겨우 메움).
      #   생성 직전에 체크아웃하면 경합 창이 4시간 → 수십 초로 줄고, 남는 초 단위 경합은
      #   아래 push 재시도(rebase)가 받는다.
      #   ※ 순서를 다시 앞으로 돌리지 말 것. app.html 은 UI 코드와 주입 데이터가 같은 파일이라
      #     낡은 체크아웃 위에 생성하면 그 사이 머지된 UI 변경을 되돌려 버린다.
      - name: Checkout hero-master-app (배포 repo) — ★생성 직전에
        uses: actions/checkout@v4
        with:
          repository: hero-bot-26/hero-master-app
          token: ${{ secrets.APP_REPO_PAT }}     # hero-master-app 쓰기 권한 PAT
          path: hero-master-app

      - name: Generate app.html (구글시트 → app.html)
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}   # 서비스계정(있으면 우선·토큰만료 없음)
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          APP_REPO_PATH:            ${{ github.workspace }}/hero-master-app
          # ★2026-08-26 추가: 생성기의 헬스·원천정체 경고는 전부 `if os.environ.get("SLACK_BOT_TOKEN")`
          #   로 감싸여 있는데 이 스텝에만 토큰이 안 들어가 **발송이 통째로 스킵**되고 있었다
          #   (로그엔 `SLACK_BOT_TOKEN 없음 — 알림 스킵`만 남는다).
          #   그 결과 PLM 마일스톤 원천이 8/11 이후 15일째 정체인데도 아무 알림이 없었다
          #   — 8/1에 이 정체를 잡으려고 신선도 감시를 만들어 놓고 경보선이 끊겨 있던 셈.
          SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}
        run: python _gen_26fw_heroes.py --sheet

      - name: Commit & push (변경 있을 때만)
        run: |
          cd hero-master-app
          git config user.name  "hero-bot"
          git config user.email "hero-bot@users.noreply.github.com"
          git add public/app.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git commit -m "데이터 갱신 (자동) $(date -u +%Y-%m-%d)"
          # 체크아웃~push 사이(수십 초)에 남이 main 에 얹었으면 rebase 하고 다시 민다.
          # ★app.html 이 원격에서도 바뀌어 충돌하면 자동 병합하지 않는다 — 우리 생성본으로
          #   덮으면 그 사이 머지된 UI 변경이 사라지고, 원격을 받으면 데이터가 낡는다.
          #   둘 다 틀리므로 abort 하고 실패로 끝낸다(슬랙 알림 → 재실행이 정답).
          for i in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거절 — origin/main 받아 rebase 후 재시도 ($i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::app.html 이 원격에서도 변경됨 — 자동 rebase 불가. 워크플로를 재실행해 최신 main 위에서 다시 생성할 것."
              exit 1
            fi
          done
          echo "::error::push 3회 실패 — 수동 확인 필요"
          exit 1

      # 26FW 대시보드 시트 준비물량 자동 보정 — MSTRD SKU에 새 컬러가 생기면 히어로 탭에 행을 채운다.
      #   ★행 삭제·수식 재배치는 하지 않는다(블록 범위 안쪽 삽입 → 소계·총계 수식이 자동 확장).
      #   실패해도 앱 갱신엔 영향 없음(별개 시트).
      - name: 대시보드 준비물량 보정 (MSTRD 기준)
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: python _dash_fix_colors.py --apply

      # ★★2026-08-10 신설: 목표 진실소스 통일.
      #   `히어로목표(거래량)` 탭은 IMPORTRANGE 가 아니라 **손으로 박은 값**이라, 담당자가 xlsx
      #   `26FW HERO 일자별 목표 셋팅`을 고쳐도 대시보드엔 영원히 반영되지 않았다.
      #   실제로 7/26 이후 갱신이 멈춰 9~12월 목표가 통째로 0 이었다(9/1이면 달성율이 깨졌을 것).
      #   → xlsx 를 정본으로 고정하고 매일 이 스텝이 시트를 따라오게 한다.
      #   멱등이라 이미 같으면 0건. 소문자 online/offline 블록만 쓰고 열·행은 건드리지 않는다.
      - name: 대시보드 목표 동기화 (xlsx 정본 → 히어로목표(거래량))
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: python _sync_target_raw.py --apply

      # ★★2026-08-04 제거: "대시보드 26FW 목표 반영"(push_26fw_targets.py --apply)
      #   이 스텝은 **시즌 누계(YTD) 목표를 MTD 목표 칸(AI/BH)에 값으로** 박아 넣고 있었다.
      #   7월엔 MTD==시즌누계라 티가 안 났지만 8/1부터 커브드팬츠 MTD 목표가 2,399 → 17,984(7.5배),
      #   달성율 156% → 21%로 왜곡됐다. 게다가 값 덮어쓰기라 담당자가 `히어로목표(거래량)` 탭을
      #   고쳐도 MTD 칸에는 영원히 반영되지 않았다.
      #   → 대시보드 목표의 단일 진실소스는 **`히어로목표(거래량)` 탭 + 각 탭의 SUMPRODUCT 수식**.
      #     (수식 범위는 그리드 확장에 맞춰 $C$..:$GV$.. 로 확장해 둠. 열이 더 늘면 범위도 늘릴 것.)
      #   ※ push_26fw_targets.py 자체는 남겨둔다 — 목표 탭이 비는 시즌 전환기에 수동으로 쓸 수 있다.
      #     단 재사용 시 tq["YTD"] 가 아니라 tq["MTD"] 를 AI/BH에 쓸 것.

      # 26FW 대시보드 A열 uid 자동 채움 + 노트북 GOODS_FILTER 동기화.
      #   ★uid 소스는 **ItemMaster '무탠'** — MSTRD SKU 의 uid 칸은 신규 SKU 에서 비어 있어(기획MD 후행 입력)
      #     _dash_fix_colors 만으로는 발매돼도 A열이 계속 빈칸이었다(실적 조용히 누락, 2026-07-31 확인).
      #   대시보드 uid 전량을 26FW 데이터시트 '_UID_FILTER' 탭에 기록 → 다음 09:30 DBX 잡이 합집합으로 읽는다.
      - name: 대시보드 uid 채움 (ItemMaster 기준)
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: python _dash_fill_uid.py --apply

      # 히어로 단계 카운트다운 슬랙 알람 (TEST_ONLY=True → 본인 DM 테스트만).
      # SLACK_BOT_TOKEN 시크릿 없으면 triggers 가 자동 스킵. 실패해도 위 app.html 작업엔 영향 X.
      - name: 히어로 단계 알람 (테스트)
        if: always()           # app.html 생성이 transient 실패해도 알람은 독립 실행
        continue-on-error: true
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m soo.hero_ops.triggers --sheet --send

      # IMC-3 발매 노출 스킴 알람 (뒷단). TEST_ONLY=True → 본인 DM. 앞단과 동일 dedup/토큰.
      - name: IMC 발매 노출 알람 (테스트)
        if: always()
        continue-on-error: true
        env:
          GOOGLE_SA_JSON:           ${{ secrets.GOOGLE_SA_JSON }}
          GOOGLE_OAUTH_CREDENTIALS: ${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN:       ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          SLACK_BOT_TOKEN:          ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m soo.hero_ops.imc_triggers --send

      # 갱신 실패 시 슬랙 DM 알림 — 토큰 만료/시트 권한·구조 문제로 조용히 멈추는 것 방지.
      - name: 실패 알림 (슬랙 DM)
        if: failure()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: >-
          python -m soo.hero_ops.notify
          "⚠️ 히어로 마스터앱 daily 갱신 실패 ($(date -u +%Y-%m-%d)) — Actions 로그 확인.
          단골 원인 GOOGLE_OAUTH_TOKEN 만료(서비스계정 전환 권장), 시트 권한, 시트 구조 변경."
